name: Descargar datos crudos (temporal)
on:
  push:
    branches: [datos]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar CSV de football-data.co.uk
        run: |
          mkdir -p crudos
          python3 - <<'PY'
          import urllib.request, pathlib
          out = pathlib.Path("crudos"); log = []
          urls = [(f"{s}_{d}.csv", f"https://www.football-data.co.uk/mmz4281/{s}/{d}.csv")
                  for s in ["2223", "2324", "2425", "2526", "2627"] for d in ["E0", "SP1", "D1", "I1", "F1"]]
          urls.append(("fixtures.csv", "https://www.football-data.co.uk/fixtures.csv"))
          for nombre, url in urls:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "pizarra-poisson/1.0"})
                  data = urllib.request.urlopen(req, timeout=60).read()
                  (out / nombre).write_bytes(data); log.append(f"{nombre} {len(data)}")
              except Exception as e:
                  log.append(f"{nombre} ERROR {e}")
          (out / "registro.txt").write_text("\n".join(log))
          print("\n".join(log))
          PY
      - name: Guardar en la rama
        run: |
          git config user.name "pizarra-bot"
          git config user.email "pizarra-bot@users.noreply.github.com"
          git add crudos
          git commit -m "Datos crudos de football-data" && git push
