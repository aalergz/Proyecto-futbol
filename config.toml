# Configuración del motor de la Pizarra Poisson
#
# fuentes: se prueban en orden y se usa la primera que responda.
#   footballdata  → football-data.co.uk (CSV gratis, con cuotas de cierre)
#   openfootball  → github.com/openfootball (gratis, a veces atrasado)
#   apifootball   → api-sports.io (requiere API_FOOTBALL_KEY); resultados minutos después de cada partido
#   csv           → archivo propio en datos/

[modelo]
xi = 0.0019               # decaimiento por día: un partido de hace un año pesa ~la mitad
regularizacion = 0.1      # acerca a su punto de partida a equipos con pocos partidos (elegido por validación)
temporadas_historial = 2  # temporadas anteriores a la actual que entran al ajuste
validar_dias = 365        # ventana de validación fuera de muestra (0 = no validar)
peso_goles = 0.7          # 70% goles reales + 30% xG o remates a puerta (elegido por validación)
reg_local = 0.3           # ventaja de local propia de cada equipo; quitar la línea = igual para todos
reg_conteos = 3.0         # regularización de los modelos de córners y tarjetas

[web]
# URL del Worker de Cloudflare que sirve los marcadores en vivo (ver worker/README).
# Vacío = la web funciona igual, sin la sección En vivo.
en_vivo_url = ""

[ligas.eng]
nombre = "Premier League (Inglaterra)"
fuentes = ["apifootball", "footballdata", "openfootball"]
apifootball = 39
footballdata = "E0"
openfootball = "en.1"
temporada_actual = "auto"   # o un año fijo: 2026 = temporada 2026-27
top = { n = 4, label = "Top 4 · Champions" }
bot = { n = 3, label = "Descenso" }

